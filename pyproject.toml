[project]
name = "quality-gates-on-a-running-pipeline"
version = "0.1.0"
description = "A learning project: decide which quality checks a table needs, and why."
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.4.0",
    "ipykernel>=7.0.0",
    "nbclient>=0.10.0",
    "nbformat>=5.10.0",
    "pandas>=2.3.0",
    "psycopg[binary]>=3.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "ruff>=0.14.0",
]

# The stores' systems are installed into the virtual environment,
# so every milestone can reach them as `store_systems`.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["store_systems"]

[tool.ruff]
line-length = 100
extend-exclude = ["*.ipynb"]
src = ["src/*", "src/*/tests", "."]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E501", "E402"]

# Tests are run per folder: `uv run pytest` inside store_systems/ or inside src/<milestone>/.
